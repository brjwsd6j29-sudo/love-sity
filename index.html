<script>

/* ==========================================
   НАСТРОЙКИ
========================================== */

const ADMIN_PASSWORD = "676767";

const audio = document.getElementById("bgMusic");

audio.loop = true;
audio.volume = 0.7;


/* ==========================================
   ФОНОВАЯ МУЗЫКА
   Играет сразу при входе на сайт.
   Если браузер блокирует автозапуск —
   включается при первом действии пользователя.
========================================== */

let musicStarted = false;
let gestureBound = false;

function startMusic(){

    if(musicStarted && !audio.paused){
        return;
    }

    audio.volume = 0.7;

    const promise = audio.play();

    if(promise !== undefined){

        promise.then(() => {

            musicStarted = true;

        }).catch(() => {

            /* Автозапуск запрещён браузером */
            bindFirstGesture();

        });

    }else{

        musicStarted = true;

    }

}

function bindFirstGesture(){

    if(gestureBound){
        return;
    }

    gestureBound = true;

    const events = ["pointerdown","touchstart","keydown","click"];

    const handler = () => {

        audio.play().then(() => {

            musicStarted = true;

        }).catch(() => {});

        events.forEach(ev => {

            document.removeEventListener(ev, handler, true);

        });

        gestureBound = false;

    };

    events.forEach(ev => {

        document.addEventListener(ev, handler, true);

    });

}

/* Запуск сразу */

startMusic();

window.addEventListener("load", startMusic);
document.addEventListener("DOMContentLoaded", startMusic);

/* Если вкладка вернулась из фона и музыка встала — продолжаем */

document.addEventListener("visibilitychange", () => {

    if(!document.hidden && audio.paused){

        startMusic();

    }

});


/* ==========================================
   ИГРЫ
========================================== */

function gameClick(game){

    showToast("🎮 Открытие " + game);

}


/* ==========================================
   МЕНЮ
========================================== */

function menuClick(section){

    const names = {

        profile:"👤 Профиль",
        top:"🏆 Рейтинг",
        bonus:"🎁 Бонусы",
        info:"ℹ️ Информация"

    };

    showToast(names[section] || "Раздел");

}


/* ==========================================
   АДМИН
========================================== */

function openAdmin(){

    document.getElementById("password").value = "";
    document.getElementById("passwordError").textContent = "";

    document
        .getElementById("passwordModal")
        .classList.add("show");

    setTimeout(() => {

        document.getElementById("password").focus();

    },200);

}


function loginAdmin(){

    const password =
        document.getElementById("password").value.trim();

    const error =
        document.getElementById("passwordError");

    if(password === ADMIN_PASSWORD){

        error.textContent = "";

        closeModal("passwordModal");

        document
            .getElementById("adminModal")
            .classList.add("show");

        showToast("🔓 Доступ разрешён");

    }else{

        error.textContent = "❌ Неверный пароль";

        document.getElementById("password").value = "";

        document.getElementById("password").focus();

    }

}


/* ==========================================
   АДМИН ДЕЙСТВИЯ
========================================== */

function adminAction(text){

    const message =
        document.getElementById("adminMessage");

    message.textContent = "✓ " + text;

    setTimeout(() => {

        message.textContent = "";

    },2500);

}


/* ==========================================
   MODAL
========================================== */

function closeModal(id){

    document
        .getElementById(id)
        .classList.remove("show");

}


/* Закрытие по фону */

document.querySelectorAll(".modal").forEach(modal => {

    modal.addEventListener("click", function(e){

        if(e.target === modal){

            modal.classList.remove("show");

        }

    });

});


/* ESC */

document.addEventListener("keydown", e => {

    if(e.key === "Escape"){

        document
            .querySelectorAll(".modal")
            .forEach(modal => {

                modal.classList.remove("show");

            });

    }

});


/* ENTER */

document
    .getElementById("password")
    .addEventListener("keydown", e => {

        if(e.key === "Enter"){

            loginAdmin();

        }

    });


/* ==========================================
   TOAST
========================================== */

let toastTimer;

function showToast(text){

    const toast =
        document.getElementById("toast");

    toast.textContent = text;

    toast.classList.add("show");

    clearTimeout(toastTimer);

    toastTimer = setTimeout(() => {

        toast.classList.remove("show");

    },1800);

}

</script>
