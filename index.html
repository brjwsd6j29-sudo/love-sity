<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Game Launcher</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:'Segoe UI',sans-serif;
  background: radial-gradient(circle at top,#0f2027,#0b1217);
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  color:#fff;
  overflow:hidden;
}

/* BACKGROUND PARTICLES */
body::before{
  content:"";
  position:absolute;
  width:200%;
  height:200%;
  background:radial-gradient(#00ffff22 1px, transparent 1px);
  background-size:40px 40px;
  animation:moveBg 20s linear infinite;
}
@keyframes moveBg{
  from{transform:translate(0,0);}
  to{transform:translate(-200px,-200px);}
}

/* MAIN CARD */
.container{
  position:relative;
  width:100%;
  max-width:420px;
  padding:30px;
  border-radius:25px;
  backdrop-filter:blur(20px);
  background:rgba(255,255,255,0.05);
  border:1px solid rgba(255,255,255,0.1);
  box-shadow:0 0 40px rgba(0,255,255,0.2);
  text-align:center;
}

/* TITLE */
h1{
  font-size:28px;
  margin-bottom:10px;
  background:linear-gradient(90deg,#00ffff,#00ff95);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

.subtitle{
  font-size:13px;
  opacity:0.7;
  margin-bottom:25px;
}

/* STATUS */
.status{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  margin-bottom:25px;
  font-size:14px;
}

.dot{
  width:10px;
  height:10px;
  border-radius:50%;
  background:#00ff95;
  box-shadow:0 0 10px #00ff95;
  animation:pulse 1.5s infinite;
}
@keyframes pulse{
  0%,100%{transform:scale(1);}
  50%{transform:scale(1.5);}
}

/* BUTTONS */
.menu{
  display:flex;
  flex-direction:column;
  gap:15px;
}

.btn{
  padding:16px;
  border:none;
  border-radius:14px;
  font-size:17px;
  font-weight:600;
  cursor:pointer;
  color:#fff;
  background:linear-gradient(135deg,#1f2937,#111827);
  transition:0.25s;
  position:relative;
  overflow:hidden;
}

.btn::before{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(120deg,transparent,rgba(0,255,255,0.4),transparent);
  opacity:0;
  transition:0.3s;
}

.btn:hover::before{
  opacity:1;
  animation:shine 1s;
}
@keyframes shine{
  from{transform:translateX(-100%);}
  to{transform:translateX(100%);}
}

.btn:hover{
  transform:translateY(-3px) scale(1.02);
  box-shadow:0 0 20px rgba(0,255,255,0.5);
}

.btn:active{
  transform:scale(0.95);
}

/* SPECIAL BUTTON */
.play{
  background:linear-gradient(135deg,#00ff95,#00bfff);
  color:#000;
  font-weight:700;
}

/* ADMIN */
.admin{
  margin-top:10px;
  background:linear-gradient(135deg,#ff416c,#ff4b2b);
}

/* MODAL */
.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.8);
  display:none;
  justify-content:center;
  align-items:center;
}

.modal.active{
  display:flex;
}

.modal-box{
  background:#111827;
  padding:25px;
  border-radius:20px;
  width:90%;
  max-width:350px;
  text-align:center;
  box-shadow:0 0 30px rgba(0,255,255,0.2);
}

input{
  width:100%;
  padding:12px;
  border-radius:10px;
  border:none;
  margin:10px 0;
  font-size:15px;
}

.modal button{
  width:100%;
  padding:12px;
  border:none;
  border-radius:10px;
  margin-top:10px;
  font-weight:700;
  cursor:pointer;
}

.login{
  background:#00ff95;
  color:#000;
}

.close{
  background:#333;
  color:#fff;
}

/* LOADING ANIMATION */
.loader{
  margin-top:20px;
  display:flex;
  justify-content:center;
  gap:5px;
}
.loader span{
  width:6px;
  height:6px;
  background:#00ffff;
  border-radius:50%;
  animation:blink 1s infinite;
}
.loader span:nth-child(2){animation-delay:0.2s;}
.loader span:nth-child(3){animation-delay:0.4s;}

@keyframes blink{
  0%,100%{opacity:0.3;}
  50%{opacity:1;}
}
</style>
</head>

<body>

<div class="container">
  <h1>GAME CORE</h1>
  <div class="subtitle">виртуальный игровой центр</div>

  <div class="status">
    <div class="dot"></div>
    <span>Сервер онлайн</span>
  </div>

  <div class="menu">
    <button class="btn play" onclick="clickAction()">▶ Играть</button>
    <button class="btn" onclick="clickAction()">🎮 Режимы</button>
    <button class="btn" onclick="clickAction()">🏆 Рейтинг</button>
    <button class="btn" onclick="clickAction()">💬 Сообщество</button>
    <button class="btn admin" onclick="openAdmin()">🔐 Панель</button>
  </div>

  <div class="loader">
    <span></span><span></span><span></span>
  </div>
</div>

<!-- ADMIN MODAL -->
<div class="modal" id="modal">
  <div class="modal-box">
    <h2>Доступ</h2>
    <input type="password" id="pass" placeholder="Введите пароль">
    <button class="login" onclick="login()">Войти</button>
    <button class="close" onclick="closeModal()">Назад</button>
    <p id="error" style="color:#ff4b2b;margin-top:10px;"></p>
  </div>
</div>

<audio id="audio" loop src="music.mp4"></audio>

<script>
const audio = document.getElementById("audio");
const PASSWORD = "676767";

/* PLAY ON CLICK */
function clickAction(){
  if(audio.paused){
    audio.volume = 0.7;
    audio.play().catch(()=>{});
  }
}

/* ADMIN */
function openAdmin(){
  document.getElementById("modal").classList.add("active");
}

function closeModal(){
  document.getElementById("modal").classList.remove("active");
}

function login(){
  const val = document.getElementById("pass").value;
  if(val === PASSWORD){
    alert("Доступ разрешён");
    closeModal();
  }else{
    document.getElementById("error").textContent = "Неверный пароль";
  }
}

/* AUTO LOAD */
window.addEventListener("click",()=>{
  if(audio.paused){
    audio.play().catch(()=>{});
  }
},{once:true});
</script>

</body>
</html>
