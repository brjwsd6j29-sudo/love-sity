<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>🎰 Lira Slots</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
* { box-sizing: border-box; }
body {
    margin: 0; padding: 20px; color: white;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: radial-gradient(circle at 50% 0%, #35305c, #141321 45%, #07070d);
    min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center;
}
.card {
    width: 100%; max-width: 350px; background: rgba(255,255,255,.07);
    border: 1px solid rgba(255,255,255,.1); backdrop-filter: blur(15px);
    border-radius: 24px; padding: 25px; text-align: center;
}
.reels {
    display: flex; gap: 10px; font-size: 50px; background: rgba(0,0,0,.3);
    padding: 15px; border-radius: 18px; margin: 20px 0; justify-content: center;
}
input {
    width: 100%; padding: 14px; border-radius: 14px; border: 1px solid rgba(255,255,255,.2);
    background: rgba(0,0,0,.3); color: white; text-align: center; font-size: 16px; margin-bottom: 15px;
}
button {
    width: 100%; padding: 16px; border: none; border-radius: 16px;
    background: linear-gradient(135deg, #765cff, #b44dff); color: white;
    font-size: 18px; font-weight: 700; cursor: pointer;
}
</style>
</head>
<body>

<div class="card">
    <h2 style="margin:0;">🎰 Lira Slots</h2>
    <div class="reels">
        <span id="r1">🎰</span>
        <span id="r2">🎰</span>
        <span id="r3">🎰</span>
    </div>
    <input type="number" id="bet" placeholder="Ставка..." value="100">
    <button id="spinBtn" onclick="play()">Крутить 🚀</button>
    <p id="msg" style="margin-top:15px; font-weight:bold;"></p>
</div>

<script>
const tg = window.Telegram.WebApp;
tg.ready();
tg.expand();

function play() {
    const bet = parseInt(document.getElementById("bet").value);
    const msg = document.getElementById("msg");
    const btn = document.getElementById("spinBtn");

    if (!bet || bet <= 0) {
        msg.textContent = "❌ Введите ставку!";
        return;
    }

    btn.disabled = true;
    
    // Рулетка
    const symbols = ["🍋", "🍒", "7️⃣", "💎"];
    const c1 = symbols[Math.floor(Math.random() * symbols.length)];
    const c2 = symbols[Math.floor(Math.random() * symbols.length)];
    const c3 = symbols[Math.floor(Math.random() * symbols.length)];

    document.getElementById("r1").textContent = c1;
    document.getElementById("r2").textContent = c2;
    document.getElementById("r3").textContent = c3;

    let mult = 0;
    if (c1 === c2 && c2 === c3) {
        mult = (c1 === "💎") ? 5 : 3;
    } else if (c1 === c2 || c2 === c3 || c1 === c3) {
        mult = 1.5;
    }

    const win = Math.floor(bet * mult);
    
    if (win > 0) {
        msg.textContent = `🎉 Выигрыш: ${win} Lira!`;
        msg.style.color = "#4dff88";
    } else {
        msg.textContent = "😔 Проигрыш!";
        msg.style.color = "#ff4d4d";
    }

    // Отправляем результат обратно боту в Telegram!
    setTimeout(() => {
        tg.sendData(JSON.stringify({
            bet: bet,
            win: win
        }));
    }, 1500);
}
</script>

</body>
</html>
