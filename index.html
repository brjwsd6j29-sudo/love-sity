<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#080812">
<title>✨ Lira Space</title>

<!-- Подключение Telegram WebApp SDK -->
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; width: 100%; min-height: 100vh; }
body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: white;
    background: radial-gradient(circle at 50% 0%, #35305c, #141321 45%, #07070d);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 20px;
}
.card {
    width: 100%; max-width: 400px;
    background: rgba(255, 255, 255, .07);
    border: 1px solid rgba(255, 255, 255, .1);
    backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
    border-radius: 28px; padding: 25px; text-align: center;
    box-shadow: 0 15px 35px rgba(0, 0, 0, .4);
}
.avatar { font-size: 60px; margin-bottom: 10px; }
.username { font-size: 24px; font-weight: 700; margin-bottom: 5px; }
.user-id { font-size: 14px; color: rgba(255, 255, 255, .5); margin-bottom: 20px; }
.status-badge {
    display: inline-block; padding: 6px 16px; border-radius: 20px;
    background: linear-gradient(135deg, #765cff, #b44dff);
    font-size: 13px; font-weight: 600;
}
</style>
</head>
<body>

<div class="card">
    <div class="avatar">👤</div>
    <div class="username" id="userName">Загрузка...</div>
    <div class="user-id" id="userId">ID: ---------</div>
    <div class="status-badge">Telegram Авторизация</div>
</div>

<script>
// Инициализация Telegram WebApp
const tg = window.Telegram.WebApp;
tg.ready();
tg.expand(); // Разворачивает окно на весь экран

// Получение данных пользователя Telegram
if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
    const user = tg.initDataUnsafe.user;
    
    // Имя пользователя
    const fullName = user.first_name + (user.last_name ? " " + user.last_name : "");
    document.getElementById("userName").textContent = fullName;
    
    // Telegram ID
    document.getElementById("userId").textContent = "ID: " + user.id;
} else {
    document.getElementById("userName").textContent = "Игрок";
    document.getElementById("userId").textContent = "Запущено вне Telegram";
}
</script>

</body>
</html>
