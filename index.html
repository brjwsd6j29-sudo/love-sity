<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Звуковая кнопка</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: #080b12;
        font-family: Arial, sans-serif;
        color: white;
    }

    .container {
        width: 90%;
        max-width: 420px;
        background: #111722;
        padding: 25px;
        border-radius: 22px;
        text-align: center;
        box-shadow: 0 10px 40px rgba(0,0,0,.4);
    }

    h1 {
        margin-top: 0;
        font-size: 25px;
    }

    .file {
        width: 100%;
        padding: 15px;
        background: #1b2331;
        border-radius: 14px;
        margin: 20px 0;
        color: #aaa;
    }

    input[type="file"] {
        width: 100%;
    }

    #fileName {
        margin: 15px 0;
        color: #7db5ff;
        font-size: 14px;
        word-break: break-all;
    }

    .sound-btn {
        width: 100%;
        border: none;
        padding: 18px;
        border-radius: 16px;
        background: #1677ff;
        color: white;
        font-size: 18px;
        font-weight: bold;
        cursor: pointer;
        transition: .15s;
    }

    .sound-btn:active {
        transform: scale(.96);
        background: #0d5ed1;
    }

    .sound-btn:disabled {
        opacity: .4;
        cursor: not-allowed;
    }
</style>
</head>

<body>

<div class="container">

    <h1>🔊 Звуковая кнопка</h1>

    <div class="file">
        <input type="file" id="soundFile" accept="audio/*">
    </div>

    <div id="fileName">
        Файл не выбран
    </div>

    <button class="sound-btn" id="playButton" disabled>
        ▶️ ПРОИГРАТЬ ЗВУК
    </button>

</div>

<script>

let audio = null;

const soundFile = document.getElementById("soundFile");
const playButton = document.getElementById("playButton");
const fileName = document.getElementById("fileName");

soundFile.addEventListener("change", function () {

    const file = this.files[0];

    if (!file) {
        audio = null;
        playButton.disabled = true;
        fileName.textContent = "Файл не выбран";
        return;
    }

    // Создаём ссылку на выбранный звук
    const url = URL.createObjectURL(file);

    audio = new Audio(url);

    fileName.textContent = "🎵 " + file.name;

    playButton.disabled = false;
});

playButton.addEventListener("click", function () {

    if (!audio) return;

    // Если звук уже играет — начинаем заново
    audio.currentTime = 0;

    audio.play().catch(error => {
        console.log("Ошибка воспроизведения:", error);
    });

});

</script>

</body>
</html>
