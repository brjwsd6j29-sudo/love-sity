const quiz = document.getElementById("quiz");

questions.forEach((q, i) => {

    const div = document.createElement("div");
    div.className = "question";
    div.id = "q" + i;

    let html = `<h3>${i + 1}. ${q[0]}</h3>`;

    q[1].forEach((option, j) => {
        html += `
        <label>
            <input type="radio" name="q${i}" value="${j}">
            ${String.fromCharCode(65 + j)}) ${option}
        </label>`;
    });

    html += `
    <button onclick="showAnswer(${i})">
        ЖАУАБЫН КӨРСЕТУ
    </button>

    <div class="answer" id="answer${i}">
        Дұрыс жауап: <b>${String.fromCharCode(65 + q[2])}) ${q[1][q[2]]}</b>
    </div>
    `;

    div.innerHTML = html;
    quiz.appendChild(div);
});

function showAnswer(i) {
    const answer = document.getElementById("answer" + i);

    if (answer.style.display === "block") {
        answer.style.display = "none";
    } else {
        answer.style.display = "block";
    }
}

function checkAnswers() {

    let score = 0;

    questions.forEach((q, i) => {

        const selected =
            document.querySelector(`input[name="q${i}"]:checked`);

        const question =
            document.getElementById("q" + i);

        question.classList.remove("correct", "wrong");

        if (selected) {

            if (Number(selected.value) === q[2]) {
                score++;
                question.classList.add("correct");
            } else {
                question.classList.add("wrong");
            }

        }

    });

    document.getElementById("result").innerHTML =
        `Нәтиже: ${score} / ${questions.length}`;

    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });
}
