<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<title>✨ Lira Game — Профиль</title>
<style>
* { box-sizing: border-box; }
body {
    margin: 0; padding: 18px; color: white;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: radial-gradient(circle at 50% 0%, #35305c, #141321 45%, #07070d);
    min-height: 100vh; display: flex; flex-direction: column;
}
.card {
    background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.1);
    backdrop-filter: blur(15px); border-radius: 24px; padding: 20px; text-align: center;
}
.avatar { font-size: 50px; margin-bottom: 10px; }
.name { font-size: 22px; font-weight: 700; }
.id { font-size: 13px; color: rgba(255,255,255,.4); margin-top: 4px; }
</style>
</head>
<body>

<div class="card">
    <div class="avatar">👤</div>
    <div class="name" id="userName">Загрузка...</div>
    <div class="id" id="userId">ID: 00000000</div>
</div>

<script>
const tg = window.Telegram.WebApp;
tg.expand();

if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
    const user = tg.initDataUnsafe.user;
    document.getElementById("userName").textContent = user.first_name + (user.last_name ? " " + user.last_name : "");
    document.getElementById("userId").textContent = "ID: " + user.id;
} else {
    document.getElementById("userName").textContent = "Откройте через Telegram!";
}
</script>

</body>
</html>
