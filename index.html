<!DOCTYPE html>
<html lang="ru">
<head>

<meta charset="UTF-8">

<!-- ❌ ОТКЛЮЧАЕМ ZOOM -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Device Control PRO</title>

<style>

body{
    margin:0;
    font-family:sans-serif;
    background:#06070f;
    color:white;
}

/* ===== DEVICE LIST ===== */

.device{
    padding:15px;
    border-bottom:1px solid #222;
    cursor:pointer;
}

.device:hover{
    background:#111;
}

/* ===== POPUP ===== */

.popup{
    position:fixed;
    inset:0;
    background:#000a;
    display:none;
    align-items:center;
    justify-content:center;
}

.popup-box{
    background:#0f1220;
    padding:20px;
    border-radius:15px;
    width:90%;
    max-width:350px;
}

/* ===== PROGRESS ===== */

.bar{
    height:10px;
    background:#222;
    border-radius:10px;
    overflow:hidden;
}

.bar span{
    display:block;
    height:100%;
    background:linear-gradient(90deg,#7a2cff,#00cfff);
    width:0%;
}

/* ===== BUTTON ===== */

.btn{
    background:#7a2cff;
    border:0;
    padding:10px;
    width:100%;
    border-radius:10px;
    color:white;
    margin-top:10px;
}

</style>
</head>

<body>

<h2 style="padding:15px;">📱 Девайсы</h2>

<div id="list"></div>

<div class="popup" id="popup">
    <div class="popup-box" id="popupContent"></div>
</div>

<script>

/* ===== DATA ===== */

const topDevices = [
"iPhone 11","iPhone 13","iPhone 14","iPhone 15","iPhone 15 Pro",
"Poco X6","Samsung A57","Samsung A26","Samsung S24 Ultra","Vivo X200"
];

for(let i=0;i<50;i++){
    topDevices.push("Device "+(i+1));
}

/* ===== RENDER ===== */

const list = document.getElementById("list");

topDevices.forEach(name=>{
    const div = document.createElement("div");
    div.className="device";
    div.innerText=name;
    div.onclick=()=>openDevice(name);
    list.appendChild(div);
});

/* ===== RANDOM STATS ===== */

function rand(){
    return Math.floor(Math.random()*100);
}

/* ===== OPEN DEVICE ===== */

function openDevice(name){

    document.getElementById("popup").style.display="flex";

    document.getElementById("popupContent").innerHTML=`
        <h3>${name}</h3>

        Хедшот: ${rand()}%<br>
        Обзор: ${rand()}%<br>
        Колиматор: ${rand()}%<br>
        2x: ${rand()}%<br>
        4x: ${rand()}%<br>
        Снайпер: ${rand()}%<br>
        Размер кнопки: ${rand()}%

        <button class="btn" onclick="openBooster()">⚡ Усилитель</button>
        <button class="btn" onclick="closePopup()">Закрыть</button>
    `;
}

/* ===== BOOSTER ===== */

function openBooster(){

    document.getElementById("popupContent").innerHTML=`
        <h3>Установка усилителя</h3>

        <input type="file" id="file">

        <button class="btn" onclick="install()">Установить</button>
    `;
}

/* ===== INSTALL ===== */

function install(){

    let progress = 0;

    document.getElementById("popupContent").innerHTML=`
        <h3>Установка...</h3>
        <div class="bar"><span id="bar"></span></div>
        <div id="percent">0%</div>
    `;

    const interval = setInterval(()=>{

        progress++;

        document.getElementById("bar").style.width=progress+"%";
        document.getElementById("percent").innerText=progress+"%";

        if(progress>=100){
            clearInterval(interval);
            done();
        }

    },30);
}

/* ===== DONE ===== */

function done(){

    document.getElementById("popupContent").innerHTML=`
        <h3>✅ Успешно!</h3>

        <button class="btn" onclick="openGame()">🎮 Открыть Free Fire</button>
    `;
}

/* ===== OPEN GAME ===== */

function openGame(){
    window.location.href="freefire://";
}

/* ===== CLOSE ===== */

function closePopup(){
    document.getElementById("popup").style.display="none";
}

</script>

</body>
</html>
