<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>36 карт</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

body {
    margin: 0;
    padding: 20px;
    background: #0b0d12;
    color: white;
    font-family: Arial, sans-serif;
}

h1 {
    text-align: center;
    margin: 0 0 8px;
}

.info {
    text-align: center;
    color: #8c93a3;
    margin-bottom: 20px;
}

.cards {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    max-width: 600px;
    margin: auto;
}

.card {
    height: 100px;
    background: #151922;
    border: 1px solid #292e3a;
    border-radius: 16px;

    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;

    cursor: pointer;
    transition: 0.2s;
}

.card:active {
    transform: scale(0.95);
}

.value {
    font-size: 24px;
    font-weight: bold;
}

.suit {
    font-size: 28px;
    margin-top: 5px;
}

.status {
    font-size: 12px;
    color: #858d9d;
    margin-top: 4px;
}

/* УШЛА */
.card.gone {
    background: #555;
    border-color: #666;
    color: #aaa;
    opacity: 0.65;
    cursor: not-allowed;
}

.card.gone .status {
    color: #ccc;
}
</style>
</head>

<body>

<h1>36 карт</h1>

<div class="info">
    Нажми на карту — она уйдёт
</div>

<div class="cards" id="cards"></div>

<script>

const cards = document.getElementById("cards");

const suits = [
    "♥️",
    "♦️",
    "♠️",
    "♣️"
];

// 36 карт
const values = [
    "6", "7", "8", "9", "10", "В", "Д", "К", "Т"
];

// Создаём карты
suits.forEach(suit => {

    values.forEach(value => {

        const card = document.createElement("div");

        card.className = "card";

        card.innerHTML = `
            <div class="value">${value}</div>
            <div class="suit">${suit}</div>
            <div class="status">Свободна</div>
        `;

        card.onclick = () => {

            if (card.classList.contains("gone")) {
                return;
            }

            card.classList.add("gone");

            card.querySelector(".status").textContent = "Ушла";
        };

        cards.appendChild(card);

    });

});

</script>

</body>
</html>
